# Local Supabase CLI config. Production settings are managed in Supabase.
# Keep app exposed to PostgREST: server actions call supabase.schema("app").rpc(...).
project_id = "operro-m13-local"

[api]
enabled = true
port = 54321
schemas = ["public", "app", "graphql_public"]
extra_search_path = ["public", "app"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./seeds/homepaw_demo.sql", "./seeds/homepaw_home_service_setup.sql", "./seeds/local_qa_payroll.sql", "./seeds/payroll_engine_s32.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_confirmations = false

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[analytics]
enabled = false

[realtime]
enabled = false

[storage]
enabled = true
file_size_limit = "5MiB"
