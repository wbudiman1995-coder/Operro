<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Explore Operro, the multi-location operating platform for modern pet-care businesses.">
<meta name="theme-color" content="#0f1b2d">
<title>Operro — Pet Care Business Platform</title>
<style>
:root{
  --navy:#0f1b2d; --navy-2:#16243b; --navy-3:#1e2f4a;
  --teal:#0f8a72; --teal-dark:#0b6e5a; --teal-light:#e3f5f1;
  --coral:#f2994a; --coral-light:#fdf0e3;
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#fbfbfc;
  --border:#e4e7ec; --border-strong:#d0d5dd;
  --text:#1a2233; --text-soft:#5b6472; --text-faint:#8a93a3;
  --danger:#d64545; --danger-light:#fbe9e9;
  --warn:#b8860b; --warn-light:#fdf3d9;
  --ok:#1a8a5f; --ok-light:#e3f6ec;
  --info:#2563a8; --info-light:#e7f0fb;
  --radius:14px; --radius-sm:9px; --radius-lg:20px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.06);
  --shadow-md:0 4px 14px rgba(16,24,40,.08);
  --shadow-lg:0 12px 32px rgba(16,24,40,.14);
  --sidebar-w:264px; --sidebar-w-collapsed:76px;
  --topbar-h:64px;
  color-scheme: light;
}
html[data-theme="dark"]{
  --navy:#0a1220; --navy-2:#0d1826; --navy-3:#13233a;
  --teal:#2bb693; --teal-dark:#1f9a7d; --teal-light:#0f2c26;
  --coral:#f2a05c; --coral-light:#3a2a17;
  --bg:#0b1220; --surface:#111a2b; --surface-2:#0e1725;
  --border:#22314a; --border-strong:#2c3d5a;
  --text:#e8ecf3; --text-soft:#a8b3c5; --text-faint:#6f7c92;
  --danger:#f2726b; --danger-light:#3a1c1c;
  --warn:#e0b23c; --warn-light:#3a3118;
  --ok:#3ecf8e; --ok-light:#123626;
  --info:#5b9cdb; --info-light:#132a42;
  color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text);
  font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,p{margin:0;}
button{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--teal-light);}
.icon{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.icon-sm{width:14px;height:14px;}
.icon-lg{width:22px;height:22px;}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}

/* ---------- App shell ---------- */
.app-shell{display:flex;min-height:100vh;}
.sidebar{
  width:var(--sidebar-w); flex:none; background:var(--navy); color:#cfd8e6;
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; z-index:40;
  transition:width .18s ease;
}
.sidebar.collapsed{width:var(--sidebar-w-collapsed);}
.sidebar-brand{
  display:flex; align-items:center; gap:10px; padding:18px 18px; height:var(--topbar-h);
  border-bottom:1px solid rgba(255,255,255,.08); flex:none;
}
.brand-mark{
  width:34px;height:34px;border-radius:10px;background:linear-gradient(160deg,var(--teal),var(--teal-dark));
  display:flex;align-items:center;justify-content:center;flex:none; box-shadow:var(--shadow-sm);
}
.brand-mark svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;}
.brand-text{display:flex;flex-direction:column;min-width:0;overflow:hidden;white-space:nowrap;}
.brand-text b{color:#fff;font-size:16px;letter-spacing:.2px;}
.brand-text span{font-size:11px;color:#9fb0c6;}
.sidebar.collapsed .brand-text{display:none;}
.sidebar-toggle{
  margin-left:auto;background:transparent;border:none;color:#9fb0c6;cursor:pointer;
  width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;
}
.sidebar-toggle:hover{background:rgba(255,255,255,.08);color:#fff;}
.sidebar.collapsed .sidebar-toggle{margin-left:0;}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 10px;}
.nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#6d7d95;padding:14px 12px 6px;font-weight:700;}
.sidebar.collapsed .nav-group-label{display:none;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#c3cee0;
  cursor:pointer;font-size:13.5px;font-weight:600;margin-bottom:2px;position:relative;white-space:nowrap;overflow:hidden;
  border:none;background:transparent;width:100%;text-align:left;
}
.nav-item .icon{stroke:#8fa0ba;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item:hover .icon{stroke:#fff;}
.nav-item.active{background:color-mix(in srgb, var(--org-accent, var(--teal)) 22%, transparent);color:#fff;}
.nav-item.active .icon{stroke:var(--org-accent, var(--teal));}
.nav-item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--org-accent, var(--teal));}
.nav-item .nav-label{overflow:hidden;text-overflow:ellipsis;}
.sidebar.collapsed .nav-item{justify-content:center;padding:10px;}
.sidebar.collapsed .nav-item .nav-label,.sidebar.collapsed .nav-item .nav-badge{display:none;}
.nav-badge{margin-left:auto;background:var(--coral);color:#3a1e05;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:20px;}
.sidebar-footer{padding:12px 14px 16px;border-top:1px solid rgba(255,255,255,.08);flex:none;}
.demo-pill{
  display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:10px;padding:8px 10px;font-size:11.5px;color:#9fb0c6;
}
.demo-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--coral);flex:none;}
.sidebar.collapsed .demo-pill span{display:none;}

/* ---------- Topbar ---------- */
.main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  height:var(--topbar-h); background:var(--surface); border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:30;
}
.mobile-menu-btn{display:none;background:none;border:none;cursor:pointer;color:var(--text-soft);padding:6px;border-radius:8px;}
.mobile-menu-btn:hover{background:var(--bg);}
.org-switcher{position:relative;}
.org-switcher-btn{
  display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border);
  padding:7px 12px;border-radius:11px;cursor:pointer;min-width:210px;text-align:left;
}
.org-switcher-btn:hover{border-color:var(--border-strong);}
.org-avatar{width:30px;height:30px;border-radius:8px;background:var(--navy-3);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none;}
.org-info{display:flex;flex-direction:column;min-width:0;flex:1;}
.org-info b{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.org-info span{font-size:11px;color:var(--text-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.searchbar{
  flex:1;max-width:380px;display:flex;align-items:center;gap:8px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:11px;padding:8px 12px;color:var(--text-faint);
}
.searchbar input{border:none;background:none;outline:none;flex:1;color:var(--text);font-size:13px;}
.searchbar .icon{stroke:var(--text-faint);}
.topbar-right{display:flex;align-items:center;gap:8px;margin-left:auto;}
.today-pill{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-soft);background:var(--surface-2);border:1px solid var(--border);padding:7px 11px;border-radius:11px;white-space:nowrap;}
.icon-btn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-soft);position:relative;flex:none;
}
.icon-btn:hover{border-color:var(--border-strong);color:var(--text);}
.icon-btn .ping{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--coral);border:2px solid var(--surface);}
.btn{
  display:inline-flex;align-items:center;gap:7px;border-radius:10px;border:1px solid transparent;
  padding:9px 15px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;line-height:1.2;
}
.btn-primary{background:var(--teal);color:#fff;box-shadow:var(--shadow-sm);}
.btn-primary:hover{background:var(--teal-dark);}
.btn-secondary{background:var(--surface);border-color:var(--border-strong);color:var(--text);}
.btn-secondary:hover{background:var(--surface-2);}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-soft);}
.btn-ghost:hover{background:var(--surface-2);color:var(--text);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-danger:hover{filter:brightness(.92);}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.profile-btn{display:flex;align-items:center;gap:8px;background:none;border:none;cursor:pointer;padding:4px;border-radius:10px;}
.profile-btn:hover{background:var(--surface-2);}
.avatar-circle{width:34px;height:34px;border-radius:50%;background:var(--teal-light);color:var(--teal-dark);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none;}

/* dropdown panel base */
.dropdown-panel{
  position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow-lg);z-index:200;overflow:hidden;
}
.dropdown-panel.left{right:auto;left:0;}
.dropdown-header{padding:14px 16px;border-bottom:1px solid var(--border);}
.dropdown-header b{font-size:13.5px;}
.dropdown-list{max-height:360px;overflow-y:auto;}
.dropdown-item{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:none;
  padding:11px 16px;cursor:pointer;color:var(--text);font-size:13px;border-bottom:1px solid var(--border);
}
.dropdown-item:last-child{border-bottom:none;}
.dropdown-item:hover{background:var(--surface-2);}
.dropdown-item.active{background:var(--teal-light);}
.dropdown-footer{padding:10px 14px;border-top:1px solid var(--border);}

/* ---------- Content area ---------- */
.content-wrap{flex:1;padding:22px 26px 60px;max-width:1440px;width:100%;margin:0 auto;}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-faint);margin-bottom:6px;}
.breadcrumb .sep{opacity:.6;}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
.page-title{font-size:22px;font-weight:800;letter-spacing:-.2px;}
.page-sub{font-size:13px;color:var(--text-soft);margin-top:4px;max-width:640px;}
.page-actions{display:flex;gap:8px;flex-wrap:wrap;}

/* ---------- Generic building blocks ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);min-width:0;}
.card-pad{padding:18px 20px;}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap;}
.card-head h3{font-size:14.5px;font-weight:800;}
.card-head .sub{font-size:12px;color:var(--text-faint);font-weight:500;margin-top:2px;}
.grid{display:grid;gap:16px;}
.grid > *{min-width:0;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:1180px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}
@media (max-width:720px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.kpi-card{padding:18px 18px;display:flex;flex-direction:column;gap:8px;}
.kpi-top{display:flex;align-items:center;justify-content:space-between;}
.kpi-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;}
.kpi-icon .icon{width:18px;height:18px;}
.kpi-label{font-size:12px;color:var(--text-soft);font-weight:700;}
.kpi-value{font-size:23px;font-weight:800;letter-spacing:-.3px;}
.kpi-delta{font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:4px;width:fit-content;padding:2px 7px;border-radius:20px;}
.kpi-delta.up{background:var(--ok-light);color:var(--ok);}
.kpi-delta.down{background:var(--danger-light);color:var(--danger);}
.kpi-delta.flat{background:var(--surface-2);color:var(--text-faint);}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;white-space:nowrap;letter-spacing:.1px;}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge-teal{background:var(--teal-light);color:var(--teal-dark);}
.badge-coral{background:var(--coral-light);color:#9a4e12;}
.badge-gray{background:var(--surface-2);color:var(--text-soft);border:1px solid var(--border);}
.badge-danger{background:var(--danger-light);color:var(--danger);}
.badge-warn{background:var(--warn-light);color:var(--warn);}
.badge-ok{background:var(--ok-light);color:var(--ok);}
.badge-info{background:var(--info-light);color:var(--info);}

table{width:100%;border-collapse:collapse;font-size:13px;}
.table-wrap{overflow-x:auto;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);font-weight:800;padding:10px 16px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle;}
tbody tr:hover{background:var(--surface-2);}
tbody tr:last-child td{border-bottom:none;}
.cell-strong{font-weight:700;}
.cell-soft{color:var(--text-soft);font-size:12px;}
.row-actions{display:flex;gap:6px;justify-content:flex-end;}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto;}
.tab-btn{padding:10px 4px;margin-right:22px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text-soft);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--teal-dark);border-bottom-color:var(--teal);}

.pillbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.select-input,.text-input,textarea.text-input{
  border:1px solid var(--border-strong);background:var(--surface);color:var(--text);border-radius:9px;
  padding:9px 11px;font-size:13px;font-family:inherit;
}
.select-input:focus,.text-input:focus{outline:2px solid var(--teal);outline-offset:1px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12px;font-weight:700;color:var(--text-soft);}
.field .hint{font-size:11px;color:var(--text-faint);font-weight:500;}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:52px 24px;color:var(--text-soft);}
.empty-state .icon{width:34px;height:34px;stroke:var(--text-faint);margin-bottom:14px;}
.empty-state b{font-size:14px;color:var(--text);}
.empty-state p{font-size:12.5px;margin-top:6px;max-width:340px;}

.avatar-init{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none;background:var(--teal-light);color:var(--teal-dark);}
.pet-avatar{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none;background:var(--coral-light);color:#9a4e12;}

/* ---------- Modal / Drawer / Toast ---------- */
.overlay-scrim{position:fixed;inset:0;background:rgba(10,16,28,.45);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .15s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;animation:popIn .16s ease;}
.modal-box.wide{max-width:760px;}
@keyframes popIn{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--border);gap:12px;}
.modal-head h2{font-size:16.5px;font-weight:800;}
.modal-head p{font-size:12.5px;color:var(--text-soft);margin-top:4px;}
.modal-close{background:none;border:none;cursor:pointer;color:var(--text-faint);padding:4px;border-radius:8px;flex:none;}
.modal-close:hover{background:var(--surface-2);color:var(--text);}
.modal-body{padding:20px 22px;overflow-y:auto;flex:1;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--border);}
.modal-foot .foot-left{margin-right:auto;font-size:12px;color:var(--text-faint);align-self:center;}

.drawer-scrim{position:fixed;inset:0;background:rgba(10,16,28,.4);z-index:500;display:flex;justify-content:flex-end;}
.drawer-box{background:var(--surface);width:100%;max-width:440px;height:100%;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:slideIn .18s ease;}
@keyframes slideIn{from{transform:translateX(16px);opacity:.4}to{transform:none;opacity:1}}
.drawer-head{padding:20px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;}
.drawer-body{padding:20px 22px;overflow-y:auto;flex:1;}
.drawer-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;}

#toast-root{position:fixed;top:18px;right:18px;z-index:900;display:flex;flex-direction:column;gap:10px;max-width:340px;}
.toast{background:var(--navy);color:#fff;padding:13px 16px;border-radius:11px;box-shadow:var(--shadow-lg);display:flex;gap:10px;align-items:flex-start;font-size:13px;animation:toastIn .18s ease;}
@keyframes toastIn{from{transform:translateX(12px);opacity:0}to{transform:none;opacity:1}}
.toast .icon{stroke:var(--teal);flex:none;margin-top:1px;}
.toast.err .icon{stroke:var(--danger);}
.toast b{display:block;font-size:13px;}
.toast span{color:#b7c2d6;font-size:12px;}

/* wizard */
.wizard-steps{display:flex;gap:0;margin-bottom:20px;overflow-x:auto;}
.wizard-step{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--text-faint);padding:6px 14px 6px 0;white-space:nowrap;}
.wizard-step .num{width:22px;height:22px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:11px;flex:none;}
.wizard-step.done .num{background:var(--teal);border-color:var(--teal);color:#fff;}
.wizard-step.current{color:var(--text);}
.wizard-step.current .num{background:var(--teal-light);border-color:var(--teal);color:var(--teal-dark);}
.wizard-step .chev{color:var(--border-strong);}

.pick-card{border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:12px;}
.pick-card:hover{border-color:var(--border-strong);}
.pick-card.selected{border-color:var(--teal);background:var(--teal-light);}
.checkline{display:flex;align-items:center;gap:10px;padding:9px 4px;}
.checkline input{width:16px;height:16px;accent-color:var(--teal);}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px;}
.kanban-col{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);min-width:230px;display:flex;flex-direction:column;max-height:74vh;}
.kanban-col-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:800;}
.kanban-col-body{padding:10px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1;}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px;box-shadow:var(--shadow-sm);cursor:pointer;}
.kcard:hover{border-color:var(--border-strong);}
.kcard .kc-time{font-size:11px;font-weight:800;color:var(--teal-dark);}
.kcard .kc-name{font-size:13.5px;font-weight:800;margin-top:2px;}
.kcard .kc-meta{font-size:11.5px;color:var(--text-soft);margin-top:5px;}
.kcard .kc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
.pet-chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:3px 8px 3px 4px;font-size:11px;font-weight:700;margin:2px 4px 2px 0;}
.pet-chip .mini-av{width:16px;height:16px;border-radius:50%;background:var(--coral-light);color:#9a4e12;font-size:8.5px;display:flex;align-items:center;justify-content:center;font-weight:800;}
.pet-chip.complete{background:var(--ok-light);color:var(--ok);border-color:transparent;}

/* timeline */
.timeline{position:relative;padding-left:26px;}
.timeline::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--border);}
.tl-item{position:relative;padding-bottom:20px;}
.tl-item::before{content:"";position:absolute;left:-26px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--teal);border:2px solid var(--surface);box-shadow:0 0 0 2px var(--border);}
.tl-item b{font-size:13px;}
.tl-item .tl-time{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
.tl-item p{font-size:12.5px;color:var(--text-soft);margin-top:4px;}

/* charts */
.bar-chart{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:10px;}
.bar-chart .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;}
.bar-chart .bar{width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--teal),var(--teal-dark));position:relative;}
.bar-chart .bar-label{font-size:10.5px;color:var(--text-faint);font-weight:700;}
.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
.legend-row{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:7px;}
.legend-swatch{width:10px;height:10px;border-radius:3px;flex:none;}
.sparkline{display:flex;align-items:flex-end;gap:3px;height:40px;}
.sparkline i{display:block;width:5px;background:var(--teal);border-radius:2px 2px 0 0;opacity:.85;}

.progress-track{height:8px;border-radius:20px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden;}
.progress-fill{height:100%;background:var(--teal);border-radius:20px;}

.chip-toggle{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);background:var(--surface);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;color:var(--text-soft);}
.chip-toggle.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.chip-toggle:hover:not(.active){border-color:var(--text-faint);}

.mobile-scrim{position:fixed;inset:0;background:rgba(10,16,28,.5);z-index:35;}

.settings-grid{grid-template-columns:220px 1fr;}
@media (max-width:720px){ .settings-grid{grid-template-columns:1fr;} }
.settings-nav{display:flex;flex-direction:column;gap:2px;}
.settings-nav button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;border:none;background:none;text-align:left;font-size:13px;font-weight:700;color:var(--text-soft);cursor:pointer;}
.settings-nav button:hover{background:var(--surface-2);}
.settings-nav button.active{background:var(--teal-light);color:var(--teal-dark);}

.tour-hint{position:fixed;z-index:850;background:var(--navy);color:#fff;padding:16px 18px;border-radius:14px;box-shadow:var(--shadow-lg);max-width:320px;}
.tour-hint b{display:block;font-size:13.5px;margin-bottom:5px;}
.tour-hint p{font-size:12.5px;color:#c3cee0;line-height:1.5;}
.tour-hint .tour-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;}
.tour-scrim{position:fixed;inset:0;background:rgba(6,10,18,.55);z-index:800;}

hr.sep-line{border:none;border-top:1px solid var(--border);margin:16px 0;}

@media (max-width:1180px){
  .tour-btn-label{display:none;}
}
.role-extra{display:inline-flex;align-items:center;gap:6px;}
@media (max-width:640px){
  #tourBtn{display:none;}
  .role-extra{display:none;}
  .cb-label{display:none;}
  .topbar{gap:8px;padding:0 12px;}
  .topbar-right{gap:6px;}
  #createBookingBtn{padding:9px;}
}
@media (max-width:960px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s ease;width:var(--sidebar-w);}
  .sidebar.mobile-open{transform:translateX(0);}
  .sidebar.collapsed{width:var(--sidebar-w);}
  .mobile-menu-btn{display:flex;}
  .org-switcher-btn{min-width:0;}
  .org-info{display:none;}
  .searchbar{display:none;}
  .today-pill{display:none;}
  .content-wrap{padding:16px 14px 50px;}
  .kanban{grid-template-columns:1fr;}
  .kanban-col{max-height:none;}
}
</style>

'use strict';
/* =========================================================================
   OPERRO PROTOTYPE — single-file demo application.
   Everything below (customers, pets, bookings, invoices, staff, money
   figures) is fictional demo data generated for sales-demo purposes only.
   ========================================================================= */

/* ---------------------------------------------------------------------
   DATE HELPERS — "today" is always the moment the page is opened, so the
   prototype looks current whenever a prospect runs it.
--------------------------------------------------------------------- */
const ANCHOR = new Date(); ANCHOR.setHours(0,0,0,0);
function dOffset(days, hh, mm){ const d = new Date(ANCHOR); d.setDate(d.getDate()+days); d.setHours(hh==null?9:hh, mm==null?0:mm, 0, 0); return d; }
function addMinutes(date, mins){ return new Date(date.getTime() + mins*60000); }
function sameDay(a,b){ a=new Date(a);b=new Date(b); return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function localISO(d){ d = new Date(d); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(d, opts){ return new Date(d).toLocaleDateString('en-GB', opts || { day:'2-digit', month:'short', year:'numeric' }); }
function fmtDateShort(d){ return new Date(d).toLocaleDateString('en-GB', { day:'2-digit', month:'short' }); }
function fmtTime(d){ return new Date(d).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' }); }
function fmtDateTime(d){ return fmtDateShort(d) + ', ' + fmtTime(d); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function relativeDay(d){ const diff = daysBetween(ANCHOR, new Date(new Date(d).setHours(0,0,0,0))); if(diff===0) return 'Today'; if(diff===1) return 'Tomorrow'; if(diff===-1) return 'Yesterday'; if(diff>1 && diff<7) return 'In '+diff+' days'; if(diff<-1 && diff>-7) return diff*-1+' days ago'; return fmtDateShort(d); }

/* ---------------------------------------------------------------------
   GENERAL HELPERS
--------------------------------------------------------------------- */
let UID_SEQ = 1000;
function uid(prefix){ UID_SEQ++; return prefix + UID_SEQ; }
function rupiah(n){ n = Math.round(n||0); const neg = n<0; n=Math.abs(n); const s = 'Rp ' + n.toLocaleString('id-ID'); return neg ? '-'+s : s; }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(name){ return String(name).trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function byId(arr, id){ return arr.find(x => x.id === id); }
function sum(arr, fn){ return arr.reduce((a,x)=>a+fn(x), 0); }
function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
function pctChange(cur, prev){ if(!prev) return 0; return Math.round(((cur-prev)/prev)*100); }

/* ---------------------------------------------------------------------
   DEMO DATA
--------------------------------------------------------------------- */
const ORGS = [
  { id:'o1', name:'Paw & Co Jakarta', shortName:'Paw & Co', color:'#0f8a72',
    locations:[
      { id:'l1', name:'Jakarta Selatan', address:'Jl. Kemang Raya No. 21, Jakarta Selatan', phone:'021-2957-4410', hours:'09:00–19:00', tz:'WIB' },
      { id:'l2', name:'Jakarta Barat', address:'Jl. Puri Kencana No. 8, Jakarta Barat', phone:'021-5821-3390', hours:'09:00–18:00', tz:'WIB' },
    ] },
  { id:'o2', name:'Paw House Kemang', shortName:'Paw House', color:'#2563a8',
    locations:[
      { id:'l3', name:'Kemang', address:'Jl. Kemang Utara IX No. 5, Jakarta Selatan', phone:'021-7180-2231', hours:'09:00–20:00', tz:'WIB' },
    ] },
  { id:'o3', name:'Happy Tails Grooming', shortName:'Happy Tails', color:'#b8860b',
    locations:[
      { id:'l4', name:'Bandung', address:'Jl. Riau No. 45, Bandung', phone:'022-4267-1180', hours:'09:00–18:00', tz:'WIB' },
    ] },
];
const LOCATIONS = ORGS.flatMap(o => o.locations.map(l => ({...l, orgId:o.id})));
function orgOf(id){ return byId(ORGS, id); }
function locOf(id){ return byId(LOCATIONS, id); }
function locsForOrg(orgId){ return LOCATIONS.filter(l => l.orgId === orgId); }

const SERVICES = [
  { id:'sv1', name:'Full Groom', duration:90, price:285000 },

function timeInputValue(d){ d=new Date(d); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function buildBookingPet(def){
  const svc = def.sv.map(svcOf);
  const dur = sum(svc, s => s.duration);
  return { id:uid('jp'), petId:def.p, serviceIds:def.sv.slice(), groomerId:def.g || null, duration:dur, status:'pending' };
}
BOOKING_MANIFEST.forEach(m => {
  const pets = m.pets.map(buildBookingPet);
  if (m.groomer) pets.forEach(p => { if(!p.groomerId) p.groomerId = m.groomer; });
  const totalDur = Math.max(...pets.map(p=>p.duration));
  const startsAt = dOffset(m.day, m.hh, m.mm);
  const endsAt = addMinutes(startsAt, totalDur);
  let opsStage = m.stage || null;
  let status = m.status || (opsStage ? (opsStage==='completed' ? 'completed' : (opsStage==='arriving' ? 'confirmed' : 'checked_in')) : 'confirmed');
  if (opsStage === 'completed') pets.forEach(p => p.status = 'complete');
  else if (opsStage === 'in_service') pets.forEach((p,i)=> p.status = i===0 ? 'in_progress' : 'pending');
  else if (opsStage === 'ready') pets.forEach(p => p.status = 'complete');
  BOOKINGS.push({
    id: uid('bk'), orgId:m.org, locationId:m.loc, customerId:m.cust,
    startsAt, endsAt, status, opsStage, pets,
    notes: m.notes || '', createdAt: dOffset(m.day - 2, 12, 0),
    invoiceId: null, wantsInvoice: !!m.invoice,
  });
});

/* ---------------------------------------------------------------------
   INVOICES — generated from completed bookings, with package-credit
   redemption modelled for the two customers who have active balances.
--------------------------------------------------------------------- */
let TAX_RATE = 11; // demo PPN rate applied uniformly across invoices, editable in Settings
let INVOICE_SEQ = 1042;
const INVOICES = [];
function computeLine(name, petId, qty, unitPrice, discount, taxable){
  discount = discount || 0;
  const gross = qty * unitPrice;
  const taxBase = Math.max(gross - discount, 0);
  const tax = taxable === false ? 0 : Math.round(taxBase * TAX_RATE / 100);
  const lineTotal = taxBase + tax;
  return { id:uid('ln'), name, petId, qty, unitPrice, discount, taxRate: taxable===false?0:TAX_RATE, taxAmount:tax, lineTotal };
}
function generateInvoiceForBooking(booking, opts){
  opts = opts || {};
  const cust = custOf(booking.customerId);
  const lines = [];
  booking.pets.forEach(jp => {
    const pet = petOf(jp.petId);
    jp.serviceIds.forEach(sid => {
      const svc = svcOf(sid);
      let discount = 0; let taxable = true;
      const wantsPkg = booking._usePackage ? !!booking._usePackage[pet.id] : true;
      const activePkg = wantsPkg && CUSTOMER_PACKAGES.find(cp => cp.customerId===booking.customerId && cp.status==='active' && cp.remaining>0 && (pkgOf(cp.packageId).scopeServiceId===sid));
      if (activePkg){
        discount = svc.price; taxable = false; activePkg.remaining -= 1;
        if (activePkg.remaining<=0) activePkg.status = 'exhausted';
      }
      lines.push(computeLine(`${svc.name} — ${pet.name}`, pet.id, 1, svc.price, discount, taxable));
    });
  });
  const subtotal = sum(lines, l => l.qty*l.unitPrice);
  const discountTotal = sum(lines, l => l.discount);
  const taxTotal = sum(lines, l => l.taxAmount);
  const total = sum(lines, l => l.lineTotal);
  INVOICE_SEQ++;
  const inv = {
    id: uid('inv'), invoiceNumber: 'INV-'+ANCHOR.getFullYear()+'-'+INVOICE_SEQ,
    orgId: booking.orgId, locationId: booking.locationId, customerId: booking.customerId, bookingId: booking.id,

    lines, subtotal, discountTotal, taxTotal, total, payments: [],
  };
  INVOICES.push(inv);
  booking.invoiceId = inv.id;
  return inv;
}
function recordPayment(invoiceId, method, amount){
  const inv = byId(INVOICES, invoiceId);
  inv.payments.push({ id:uid('pay'), method, amount, paidAt:new Date() });
  const paid = sum(inv.payments, p=>p.amount);
  inv.status = paid >= inv.total ? 'paid' : (paid>0 ? 'partial' : 'unpaid');
  return inv;
}
function refundedAmount(inv){ return sum(inv.refunds||[], r=>r.amount); }
function recordRefund(invoiceId, amount, reason){
  const inv = byId(INVOICES, invoiceId);
  inv.refunds = inv.refunds || [];
  inv.refunds.push({ id:uid('rf'), amount, reason: reason||'Customer request', at:new Date() });
  inv.status = 'refunded';
  return inv;
}
function paymentStatusLabel(inv){
  if (inv.status==='refunded') return 'Refunded';
  const paid = paidAmount(inv);
  if (paid<=0) return 'Unpaid';
  return paid>=inv.total ? 'Paid' : 'Partial';
}

function payrollRowFor(staff){
  const comp = COMPENSATION[staff.id] || { payType:'salary', base:0, hourly:0, serviceCommissionPct:0, productCommissionPct:0, bonus:0 };
  const jobs = completedBookingsFor(staff.id, staff.orgId);
  const revenueLines = [];
  jobs.forEach(b => b.pets.filter(p=>p.groomerId===staff.id && p.status==='complete').forEach(p => p.serviceIds.forEach(sid => revenueLines.push(svcOf(sid).price))));
  const serviceRevenue = sum(revenueLines, x=>x);
  const scheduledHours = staff.role==='Groomer' ? 40 : 45;
  const completedServices = revenueLines.length;
  let base = comp.payType==='salary' ? comp.base : (comp.payType==='hourly' ? comp.hourly*scheduledHours : 0);
  const commission = Math.round(serviceRevenue * (comp.serviceCommissionPct/100));
  const bonus = comp.bonus||0;
  const deductions = Math.round((base+commission+bonus) * 0.02); // demo BPJS-style deduction estimate
  const total = base + commission + bonus - deductions;
  const approval = PAYROLL_APPROVAL[staff.id] || 'draft';
  return { staff, comp, scheduledHours, completedServices, serviceRevenue, base, commission, bonus, deductions, total, approval };
}

function donutChart(segments, size){
  size = size || 132;

  const stops = segments.map(s => { const start = acc/total*360; acc += s.value; const end = acc/total*360; return `${s.color} ${start}deg ${end}deg`; }).join(', ');
  return `<div class="donut-wrap">
    <div style="width:${size}px;height:${size}px;border-radius:50%;background:conic-gradient(${segments.length?stops:'var(--border) 0deg 360deg'});display:flex;align-items:center;justify-content:center;flex:none;">

        <b style="font-size:18px;">${total}</b><span style="font-size:10.5px;color:var(--text-faint);">total</span>
      </div>
    </div>
    <div>${segments.map(s=>`<div class="legend-row"><span class="legend-swatch" style="background:${s.color}"></span><span style="font-weight:700;">${s.value}</span><span style="color:var(--text-faint);">${s.label}</span></div>`).join('')}</div>
  </div>`;
}
function sparkline(values){

function kpi(icon,label,value,delta,tone){
  const toneVar = {info:'var(--info)',teal:'var(--teal)',ok:'var(--ok)',coral:'var(--coral)',danger:'var(--danger)',warn:'var(--warn)'}[tone] || 'var(--teal)';
  const toneBg = {info:'var(--info-light)',teal:'var(--teal-light)',ok:'var(--ok-light)',coral:'var(--coral-light)',danger:'var(--danger-light)',warn:'var(--warn-light)'}[tone] || 'var(--teal-light)';
  let deltaHtml = '';
  if (delta!==null && delta!==undefined) deltaHtml = `<span class="kpi-delta ${delta>0?'up':delta<0?'down':'flat'}">${delta>0?'+':''}${delta}% vs last week</span>`;
  return `<div class="card kpi-card"><div class="kpi-top"><span class="kpi-label">${label}</span><div class="kpi-icon" style="background:${toneBg};color:${toneVar}"><svg class="icon" style="stroke:${toneVar}"><use href="#${icon}"/></svg></div></div><div class="kpi-value">${value}</div>${deltaHtml}</div>`;
}
function emptyState(icon,title,sub){ return `<div class="empty-state"><svg class="icon"><use href="#${icon}"/></svg><b>${escapeHtml(title)}</b>${sub?`<p>${escapeHtml(sub)}</p>`:''}</div>`; }
function wireDashboardEvents(){
  document.querySelectorAll('[data-goto-route]').forEach(b => b.addEventListener('click', ()=> navigate(b.dataset.gotoRoute)));
  document.querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', ()=> { const [route,param] = b.dataset.goto.split('|'); navigate(route, param); }));
  wireLocationChipBar(()=>render('dashboard'));
  const map = { booking:()=>openBookingWizard(), customer:()=>openAddCustomerModal(), package:()=>openSellPackageModal(), payment:()=>openRecordPaymentModal(), ops:()=>navigate('operations'), followup:()=>openCreateFollowupModal() };
  document.querySelectorAll('[data-qa]').forEach(b => b.addEventListener('click', ()=> map[b.dataset.qa] && map[b.dataset.qa]()));
}
WIRERS.dashboard = wireDashboardEvents;

const WIZ_STEPS = ['Customer','Pets','Services','Schedule','Extras','Review'];
let WIZ = null;
function openBookingWizard(prefill){
  prefill = prefill || {};
  WIZ = {
    step: 0,
    customerId: prefill.customerId || null,
    petIds: prefill.petIds ? prefill.petIds.slice() : [],
    services: {}, // petId -> [serviceIds]
    groomers: {}, // petId -> staffId
    locationId: null,
    dateISO: null,
    time: '09:00',
    usePackage: {}, // petId -> bool (only offered when eligible)
    notes: '',
  };
  openModal({
    title:'Create booking', subtitle:'Book one or more pets for grooming services', wide:true, dismissible:false,
    body:`<div class="wizard-steps" id="wizSteps"></div><div id="wizBody"></div>`,
    foot:`<span class="foot-left" id="wizFootNote"></span><button class="btn btn-secondary" id="wizCancel">Cancel</button><button class="btn btn-secondary" id="wizBack">Back</button><button class="btn btn-primary" id="wizNext">Next</button>`,
    onMount: () => {
      document.getElementById('wizCancel').addEventListener('click', closeModal);
      document.getElementById('wizBack').addEventListener('click', () => { if(WIZ.step>0){ WIZ.step--; renderWizard(); } });
      document.getElementById('wizNext').addEventListener('click', wizardNext);
      renderWizard();
    }
  });
}
function wizardStepsHtml(){
  return WIZ_STEPS.map((label,i)=>`<div class="wizard-step ${i<WIZ.step?'done':''} ${i===WIZ.step?'current':''}">
      <span class="num">${i<WIZ.step?'✓':i+1}</span><span>${label}</span>${i<WIZ_STEPS.length-1?'<span class="chev">›</span>':''}
    </div>`).join('');
}

  else if (WIZ.step === 2){
    body.innerHTML = WIZ.petIds.map(pid => { const pet = petOf(pid); const sel = WIZ.services[pid] || [];

    body.querySelectorAll('[data-svc]').forEach(cb => cb.addEventListener('change', () => {

  else if (WIZ.step === 3){
    const cust = custOf(WIZ.customerId);

        <div class="field"><label>Time</label><input type="time" class="text-input" id="wizTime" value="${WIZ.time}"></div>
      </div>
      <p style="font-size:12.5px;color:var(--text-soft);margin-bottom:10px;">Assign a groomer to each pet.</p>
      <div style="display:flex;flex-direction:column;gap:10px;">${WIZ.petIds.map(pid=>{ const pet=petOf(pid); const cur = WIZ.groomers[pid] || pet.preferredGroomerId;
        return `<div style="display:flex;align-items:center;gap:12px;"><div class="pet-avatar" style="width:36px;height:36px;font-size:11px;">${initials(pet.name)}</div><span style="font-weight:700;font-size:13px;flex:none;width:90px;">${pet.name}</span>
          <select class="select-input" data-groomer="${pid}" style="flex:1;">${groomers.map(g=>`<option value="${g.id}" ${cur===g.id?'selected':''}>${g.name}${g.id===pet.preferredGroomerId?' (preferred)':''}</option>`).join('')}</select></div>`; }).join('')}
      </div>`;
    document.getElementById('wizLoc').addEventListener('change', function(){ WIZ.locationId=this.value; renderWizard(); });
    document.getElementById('wizDate').addEventListener('change', function(){ WIZ.dateISO=this.value; });
    document.getElementById('wizTime').addEventListener('change', function(){ WIZ.time=this.value; });
    body.querySelectorAll('[data-groomer]').forEach(sel => sel.addEventListener('change', function(){ WIZ.groomers[this.dataset.groomer]=this.value; }));

  }

      </div></div>` : ''}
      <div class="field"><label>Notes for this booking</label><textarea class="text-input" id="wizNotes" rows="3" placeholder="Any special instructions for this visit…">${escapeHtml(WIZ.notes)}</textarea></div>`;

function wizardNext(){
  if (WIZ.step===0 && !WIZ.customerId) return toast('Select a customer', 'Choose who this booking is for.', 'err');
  if (WIZ.step===1 && WIZ.petIds.length===0) return toast('Select at least one pet', '', 'err');
  if (WIZ.step===2 && WIZ.petIds.some(pid => !(WIZ.services[pid]||[]).length)) return toast('Choose services', 'Every pet needs at least one service.', 'err');
  if (WIZ.step===3 && (!WIZ.dateISO || !WIZ.time)) return toast('Set a date and time', '', 'err');
  if (WIZ.step < WIZ_STEPS.length-1){ WIZ.step++; renderWizard(); return; }
  confirmBookingFromWizard();
}
function confirmBookingFromWizard(){
  const pets = WIZ.petIds.map(pid => ({ id:uid('jp'), petId:pid, serviceIds:(WIZ.services[pid]||[]).slice(), groomerId: WIZ.groomers[pid], duration: sum((WIZ.services[pid]||[]).map(svcOf), s=>s.duration), status:'pending' }));
  const totalDur = Math.max(...pets.map(p=>p.duration));
  const startsAt = new Date(WIZ.dateISO+'T'+WIZ.time+':00');
  const isToday = sameDay(startsAt, ANCHOR);
  const booking = { id:uid('bk'), orgId:STATE.orgId, locationId:WIZ.locationId, customerId:WIZ.customerId, startsAt, endsAt:addMinutes(startsAt,totalDur), status:'confirmed', opsStage: isToday ? 'arriving' : null, pets, notes:WIZ.notes, createdAt:new Date(), invoiceId:null, wantsInvoice:false, _usePackage:{...WIZ.usePackage} };
  BOOKINGS.push(booking);
  closeModal();
  toast('Booking confirmed', `${bookingLabel(booking)} for ${custOf(booking.customerId).name} on ${fmtDate(startsAt)} at ${fmtTime(startsAt)}.`);
  navigate('bookings');
}

/* ---- CSV export ---- */
function exportCSV(filename, headers, rows){
  const esc = v => { v = String(v==null?'':v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  const csv = [headers.map(esc).join(','), ...rows.map(r => r.map(esc).join(','))].join('\r\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toast('Export ready', filename+' downloaded (demo data).');
}

/* ---------- OPERATIONS ---------- */
const OPS_COLUMNS = [
  ['arriving','Arriving'],
  ['checked_in','Checked in'],
  ['in_service','In service'],
  ['ready','Ready for pickup'],
  ['completed','Completed'],
];
RENDERERS.operations = function(){
  const org = currentOrg();
  const jobs = BOOKINGS.filter(b => b.orgId===org.id && locMatches(b) && sameDay(b.startsAt, ANCHOR) && !['cancelled','no_show'].includes(b.status));
  const byCol = {}; OPS_COLUMNS.forEach(c=>byCol[c[0]]=[]);
  jobs.forEach(b => { const stage = b.opsStage || 'arriving'; (byCol[stage]||byCol.arriving).push(b); });
  Object.values(byCol).forEach(list => list.sort((a,b)=>new Date(a.startsAt)-new Date(b.startsAt)));

  return `
  <div class="page-head"><div><div class="page-title">Operations</div><div class="page-sub">Track each pet from arrival to pickup, ${org.name}.</div></div></div>
  ${locationChipBar(org.id)}
  <div class="kanban">
    ${OPS_COLUMNS.map(([key,label]) => `<div class="kanban-col"><div class="kanban-col-head"><span>${label}</span><span class="badge badge-gray">${byCol[key].length}</span></div>
      <div class="kanban-col-body">${byCol[key].length ? byCol[key].map(b=>opsCard(b,key)).join('') : `<p style="text-align:center;font-size:11.5px;color:var(--text-faint);padding:20px 8px;">Nothing here</p>`}</div>
    </div>`).join('')}
  </div>`;
};
function opsCard(b, stage){
  const cust = custOf(b.customerId);
  const allComplete = b.pets.every(p=>p.status==='complete');
  const paid = paymentStatusFor(b);
  let actionHtml = '';
  if (stage==='arriving') actionHtml = `<button class="btn btn-secondary btn-sm" data-ops-checkin="${b.id}">Check in</button>`;
  else if (stage==='checked_in') actionHtml = `<button class="btn btn-primary btn-sm" data-ops-start="${b.id}">Start service</button>`;
  else if (stage==='in_service') actionHtml = b.pets.map(p => `<div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;"><span style="font-size:11.5px;font-weight:700;">${petOf(p.petId).name}</span>${p.status==='complete'?'<span class="badge badge-ok">Done</span>':p.status==='in_progress'?`<button class="btn btn-secondary btn-sm" data-ops-complete-pet="${b.id}|${p.id}">Complete</button>`:`<button class="btn btn-ghost btn-sm" data-ops-start-pet="${b.id}|${p.id}">Start</button>`}</div>`).join('');
  else if (stage==='ready') actionHtml = `<button class="btn btn-primary btn-sm" data-ops-complete-booking="${b.id}" ${allComplete?'':'disabled'}>Complete booking</button>`;
  else if (stage==='completed') actionHtml = `<button class="btn btn-ghost btn-sm" data-ops-view-invoice="${b.id}">View invoice</button>`;
  return `<div class="kcard">
    <div class="kc-time">${fmtTime(b.startsAt)}</div>
    <div class="kc-name">${cust.name}</div>
    <div>${b.pets.map(p=>`<span class="pet-chip ${p.status==='complete'?'complete':''}"><span class="mini-av">${initials(petOf(p.petId).name).slice(0,1)}</span>${petOf(p.petId).name}</span>`).join('')}</div>
    <div class="kc-meta">${b.pets.flatMap(p=>serviceNamesFor(p)).join(', ')}</div>
    <div class="kc-meta">Groomer: ${[...new Set(b.pets.map(p=>p.groomerId).filter(Boolean))].map(id=>staffOf(id).name).join(', ')||'Unassigned'} · ${Math.max(...b.pets.map(p=>p.duration))} min</div>
    ${b.notes ? `<div class="kc-meta" style="color:var(--coral);font-weight:700;">Note: ${escapeHtml(b.notes)}</div>` : ''}
    <div class="kc-foot">${paymentBadge(paid)}<div style="display:flex;gap:6px;flex-direction:column;align-items:flex-end;">${actionHtml}</div></div>
  </div>`;
}
function wireOperationsEvents(){
  wireLocationChipBar(()=>render('operations'));
  document.querySelectorAll('[data-ops-checkin]').forEach(b => b.addEventListener('click', () => { bookingOf(b.dataset.opsCheckin).opsStage='checked_in'; toast('Checked in'); render('operations'); }));
  document.querySelectorAll('[data-ops-start]').forEach(b => b.addEventListener('click', () => { const bk=bookingOf(b.dataset.opsStart); bk.opsStage='in_service'; toast('Service started'); render('operations'); }));
  document.querySelectorAll('[data-ops-start-pet]').forEach(b => b.addEventListener('click', () => { const [bid,jid]=b.dataset.opsStartPet.split('|'); const bk=bookingOf(bid); bk.pets.find(p=>p.id===jid).status='in_progress'; render('operations'); }));
  document.querySelectorAll('[data-ops-complete-pet]').forEach(b => b.addEventListener('click', () => {
    const [bid,jid]=b.dataset.opsCompletePet.split('|'); const bk=bookingOf(bid); bk.pets.find(p=>p.id===jid).status='complete';
    if (bk.pets.every(p=>p.status==='complete')) { bk.opsStage='ready'; toast('All pets ready', bookingLabel(bk)+' is ready for pickup.'); }
    render('operations');
  }));
  document.querySelectorAll('[data-ops-complete-booking]').forEach(b => b.addEventListener('click', () => {
    const bk = bookingOf(b.dataset.opsCompleteBooking);
    confirmAction('Complete booking?', `This generates an invoice for ${custOf(bk.customerId).name} covering ${bookingLabel(bk)}. This can’t be undone in the demo.`, () => {
      bk.opsStage='completed'; bk.status='completed';

      render('operations');
    }, 'Complete & invoice');
  }));

    const bk = bookingOf(b.dataset.opsViewInvoice);

}
WIRERS.operations = wireOperationsEvents;
function openInvoiceModal(invoiceId){

        ${inv.lines.map(l=>`<tr><td>${escapeHtml(l.name)}</td><td>${l.qty}</td><td>${rupiah(l.unitPrice)}</td><td>${l.discount?'-'+rupiah(l.discount):'—'}</td><td>${rupiah(l.taxAmount)}</td><td class="cell-strong">${rupiah(l.lineTotal)}</td></tr>`).join('')}
      </tbody></table></div>
      <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px;font-size:13px;max-width:260px;margin-left:auto;">
        <div style="display:flex;justify-content:space-between;"><span>Subtotal</span><span>${rupiah(inv.subtotal)}</span></div>
        <div style="display:flex;justify-content:space-between;"><span>Discount</span><span>-${rupiah(inv.discountTotal)}</span></div>
        <div style="display:flex;justify-content:space-between;"><span>Tax</span><span>${rupiah(inv.taxTotal)}</span></div>
        <div style="display:flex;justify-content:space-between;font-weight:800;font-size:15px;border-top:1px solid var(--border);padding-top:6px;"><span>Total</span><span>${rupiah(inv.total)}</span></div>
        <div style="display:flex;justify-content:space-between;color:var(--text-faint);"><span>Paid</span><span>${rupiah(paidAmount(inv))}</span></div>
        ${refundedAmount(inv)>0?`<div style="display:flex;justify-content:space-between;color:var(--danger);"><span>Refunded</span><span>-${rupiah(refundedAmount(inv))}</span></div><div style="display:flex;justify-content:space-between;font-weight:700;"><span>Net collected</span><span>${rupiah(netPaidAmount(inv))}</span></div>`:''}
      </div>
      ${inv.payments.length ? `<div style="margin-top:14px;"><b style="font-size:12.5px;">Payment history</b>${inv.payments.map(p=>`<div style="font-size:12px;color:var(--text-soft);margin-top:4px;">${fmtDateTime(p.paidAt)} · ${p.method} · ${rupiah(p.amount)}</div>`).join('')}</div>` : ''}
      ${(inv.refunds||[]).length ? `<div style="margin-top:10px;"><b style="font-size:12.5px;color:var(--danger);">Refund history</b>${inv.refunds.map(r=>`<div style="font-size:12px;color:var(--text-soft);margin-top:4px;">${fmtDateTime(r.at)} · ${escapeHtml(r.reason)} · -${rupiah(r.amount)}</div>`).join('')}</div>` : ''}`,
    foot: inv.status==='refunded' ? `<button class="btn btn-secondary" id="invCloseBtn">Close</button>`
      : inv.status==='paid' ? `<button class="btn btn-secondary" id="invCloseBtn">Close</button><button class="btn btn-danger" id="invRefundBtn">Issue refund</button>`
      : `<button class="btn btn-secondary" id="invCloseBtn">Close</button><button class="btn btn-primary" id="invPayBtn">Record payment</button>`,
    onMount: (el) => {
      document.getElementById('invCloseBtn').addEventListener('click', closeModal);
      const payBtn=document.getElementById('invPayBtn'); if(payBtn) payBtn.addEventListener('click', ()=>{ closeModal(); openRecordPaymentModal(inv.id); });
      const refundBtn=document.getElementById('invRefundBtn'); if(refundBtn) refundBtn.addEventListener('click', ()=>{
        confirmAction('Issue a full refund?', `This refunds ${rupiah(paidAmount(inv))} to ${cust.name} for ${inv.invoiceNumber}. This is recorded as a demo refund only — no real payment gateway is contacted.`, () => {
          recordRefund(inv.id, paidAmount(inv), 'Customer request');
          closeModal(); toast('Refund issued', `${rupiah(paidAmount(inv))} refunded on ${inv.invoiceNumber}.`);
          render(STATE.route, STATE.routeParam);
        }, 'Issue refund');
      });
    }
  });
}

function lifetimeValue(cid){ return sum(INVOICES.filter(i=>i.customerId===cid), netPaidAmount); }
function outstandingFor(cid){ return sum(INVOICES.filter(i=>i.customerId===cid && (i.status==='unpaid'||i.status==='partial')), i=>Math.max(i.total-paidAmount(i),0)); }
function totalVisits(cid){ return BOOKINGS.filter(b=>b.customerId===cid && displayStatus(b)==='completed').length; }
function lastVisit(cid){ const done = BOOKINGS.filter(b=>b.customerId===cid && displayStatus(b)==='completed').sort((a,b)=>new Date(b.startsAt)-new Date(a.startsAt)); return done[0] ? done[0].startsAt : null; }

function c360Packages(c){

      <div style="display:flex;justify-content:space-between;align-items:center;"><b>${pk.name}</b><span class="badge ${cp.status==='active'?'badge-ok':cp.status==='expiring'?'badge-warn':cp.status==='exhausted'?'badge-gray':'badge-danger'}">${cp.status}</span></div>
      <div style="margin-top:10px;font-size:12px;color:var(--text-soft);">${used} of ${pk.sessions} sessions used</div>
      <div class="progress-track" style="margin-top:6px;"><div class="progress-fill" style="width:${clamp(used/pk.sessions*100,0,100)}%"></div></div>
      <div style="margin-top:8px;font-size:11.5px;color:var(--text-faint);">Purchased ${fmtDate(cp.purchasedAt)} · expires ${fmtDate(cp.expiresAt)}</div>
    </div></div>`; }).join('')}</div>` : emptyState('ic-gift','No packages yet','Sell this customer a package to get started.')}`;
}
function c360History(c){
  const events = [];
  BOOKINGS.filter(b=>b.customerId===c.id).forEach(b => {
    events.push({ at:b.createdAt, title:'Booking created', detail:`${bookingLabel(b)} · ${fmtDateTime(b.startsAt)}` });
    if (b.status==='cancelled') events.push({ at:b.startsAt, title:'Booking cancelled', detail:`${bookingLabel(b)} · was scheduled for ${fmtDateTime(b.startsAt)}` });
    b.pets.filter(p=>p.status==='complete').forEach(p => events.push({ at:b.startsAt, title:`${petOf(p.petId).name} completed service`, detail: serviceNamesFor(p).join(', ') }));
  });
  RESCHEDULE_LOG.filter(r => { const b=bookingOf(r.bookingId); return b && b.customerId===c.id; }).forEach(r => events.push({ at:r.at, title:'Booking rescheduled', detail:`${fmtDateTime(r.from)} → ${fmtDateTime(r.to)}` }));
  invoicesForCustomer(c.id).forEach(inv => { events.push({ at:inv.issuedAt, title:'Invoice issued', detail:`${inv.invoiceNumber} · ${rupiah(inv.total)}` });
    inv.payments.forEach(p => events.push({ at:p.paidAt, title:'Payment received', detail:`${rupiah(p.amount)} via ${p.method}` })); });
  customerPackagesFor(c.id).forEach(cp => events.push({ at:cp.purchasedAt, title:'Package purchased', detail:pkgOf(cp.packageId).name }));
  notesFor(c.id).forEach(n => events.push({ at:n.at, title:'Note added', detail:n.text }));
  events.sort((a,b)=>new Date(b.at)-new Date(a.at));
  if (!events.length) return emptyState('ic-clipboard','No history yet','Activity for this customer will appear here.');
  return `<div class="card card-pad"><div class="timeline">${events.slice(0,40).map(e=>`<div class="tl-item"><b>${escapeHtml(e.title)}</b><div class="tl-time">${fmtDateTime(e.at)}</div><p>${escapeHtml(e.detail)}</p></div>`).join('')}</div></div>`;
}
function c360Notes(c){
  const all = (c.notes ? [{ text:c.notes, at:c.since }] : []).concat(notesFor(c.id));
  return `<div style="margin-bottom:12px;"><button class="btn btn-secondary btn-sm" data-c360-action="note"><svg class="icon icon-sm"><use href="#ic-plus"/></svg>Add note</button></div>
  <div class="card">${all.length ? all.map(n=>`<div style="padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;align-items:flex-start;"><div><p style="font-size:13px;">${escapeHtml(n.text)}</p><div style="font-size:11px;color:var(--text-faint);margin-top:5px;">${fmtDateTime(n.at)}${n.id?'':' · profile note'}</div></div>${n.id?`<button class="btn btn-ghost btn-sm" data-delete-note="${n.id}" aria-label="Delete note"><svg class="icon icon-sm" style="stroke:var(--danger)"><use href="#ic-trash"/></svg></button>`:''}</div>`).join('') : `<div class="card-pad">${emptyState('ic-edit','No notes yet','Add an internal note about this customer.')}</div>`}</div>`;

function c360ActionHandler(cid, a){

/* ---------- CALENDAR ---------- */
const CAL_STATE = { view:'day', dateISO: localISO(ANCHOR), groomer:'all', service:'all' };
const CAL_START_HOUR = 8, CAL_END_HOUR = 19;
RENDERERS.calendar = function(){
  const org = currentOrg();
  const locs = locsForOrg(org.id);
  const groomers = groomersForOrg(org.id).filter(g => STATE.locationId==='all' || g.locationId===STATE.locationId);
  const dateObj = new Date(CAL_STATE.dateISO+'T00:00:00');
  let bookings = BOOKINGS.filter(b => b.orgId===org.id && locMatches(b) && !['cancelled','no_show'].includes(b.status));
  if (CAL_STATE.groomer!=='all') bookings = bookings.filter(b => b.pets.some(p=>p.groomerId===CAL_STATE.groomer));
  if (CAL_STATE.service!=='all') bookings = bookings.filter(b => b.pets.some(p=>p.serviceIds.includes(CAL_STATE.service)));

  return `
  <div class="page-head"><div><div class="page-title">Calendar</div><div class="page-sub">Day and week scheduling across ${org.name}.</div></div>
    <div class="page-actions">
      <button class="chip-toggle ${CAL_STATE.view==='day'?'active':''}" data-cal-view="day">Day</button>
      <button class="chip-toggle ${CAL_STATE.view==='week'?'active':''}" data-cal-view="week">Week</button>
    </div></div>
  ${locationChipBar(org.id)}
  <div class="pillbar">
    <button class="btn btn-secondary btn-sm" id="calPrev" aria-label="Previous period"><svg class="icon icon-sm"><use href="#ic-chevron-left"/></svg></button>
    <button class="btn btn-secondary btn-sm" id="calToday">Today</button>
    <button class="btn btn-secondary btn-sm" id="calNext" aria-label="Next period"><svg class="icon icon-sm"><use href="#ic-chevron-right"/></svg></button>
    <span style="font-weight:800;font-size:13.5px;margin-left:4px;">${CAL_STATE.view==='day' ? fmtDate(dateObj,{weekday:'long',day:'2-digit',month:'long',year:'numeric'}) : weekRangeLabel(dateObj)}</span>
    <select class="select-input" id="calGroomerFilter" style="margin-left:auto;"><option value="all">All groomers</option>${groomers.map(g=>`<option value="${g.id}" ${CAL_STATE.groomer===g.id?'selected':''}>${g.name}</option>`).join('')}</select>
    <select class="select-input" id="calServiceFilter"><option value="all">All services</option>${SERVICES.map(s=>`<option value="${s.id}" ${CAL_STATE.service===s.id?'selected':''}>${s.name}</option>`).join('')}</select>
  </div>
  <div class="card card-pad" style="overflow-x:auto;">
    ${CAL_STATE.view==='day' ? calDayGrid(dateObj, groomers, bookings) : calWeekGrid(dateObj, bookings)}
  </div>`;
};
function weekRangeLabel(d){ const day=(d.getDay()+6)%7; const mon=new Date(d); mon.setDate(d.getDate()-day); const sun=new Date(mon); sun.setDate(mon.getDate()+6); return fmtDate(mon,{day:'2-digit',month:'short'})+' – '+fmtDate(sun,{day:'2-digit',month:'short',year:'numeric'}); }
function calDayGrid(dateObj, groomers, bookings){
  const dayBookings = bookings.filter(b => sameDay(b.startsAt, dateObj));
  const hours = []; for(let h=CAL_START_HOUR; h<=CAL_END_HOUR; h++) hours.push(h);
  const rowH = 58;
  const cols = groomers.length ? groomers : [{id:'none',name:'Unassigned'}];
  return `<div style="display:grid;grid-template-columns:64px repeat(${cols.length},minmax(150px,1fr));min-width:${64+cols.length*160}px;">
    <div></div>
    ${cols.map(g=>`<div style="font-weight:800;font-size:12.5px;padding:8px;border-bottom:2px solid var(--border-strong);text-align:center;">${g.name}</div>`).join('')}
    ${hours.map(h=>`<div style="height:${rowH}px;font-size:11px;color:var(--text-faint);text-align:right;padding-right:8px;border-top:1px solid var(--border);">${String(h).padStart(2,'0')}:00</div>
      ${cols.map(g=>`<div style="height:${rowH}px;border-top:1px solid var(--border);border-left:1px solid var(--border);position:relative;">
        ${dayBookings.filter(b=>b.pets.some(p=>(p.groomerId||'none')===g.id) && new Date(b.startsAt).getHours()===h).map(b=>calBlock(b)).join('')}
      </div>`).join('')}`).join('')}
  </div>`;
}
function calBlock(b){
  const st = displayStatus(b); const meta = STATUS_META[st];
  const colorMap = { draft:'#8a93a3',confirmed:'#2563a8',checked_in:'#0f8a72',in_service:'#b8860b',ready:'#f2994a',completed:'#1a8a5f' };
  const mins = new Date(b.startsAt).getMinutes();
  const dur = Math.max(...b.pets.map(p=>p.duration));
  return `<div data-cal-booking="${b.id}" style="position:absolute;top:${mins/60*58}px;left:3px;right:3px;min-height:${Math.max(dur/60*58-4,30)}px;background:${colorMap[st]||'#8a93a3'}1a;border-left:3px solid ${colorMap[st]||'#8a93a3'};border-radius:6px;padding:5px 7px;cursor:pointer;overflow:hidden;">
    <div style="font-size:11px;font-weight:800;color:${colorMap[st]||'#8a93a3'};">${fmtTime(b.startsAt)}</div>
    <div style="font-size:11.5px;font-weight:700;">${custOf(b.customerId).name}</div>
    <div style="font-size:10.5px;color:var(--text-faint);">${petNamesFor(b).join(', ')}</div>
  </div>`;
}
function calWeekGrid(dateObj, bookings){
  const day=(dateObj.getDay()+6)%7; const mon=new Date(dateObj); mon.setDate(dateObj.getDate()-day);
  const days = []; for(let i=0;i<7;i++){ const d=new Date(mon); d.setDate(mon.getDate()+i); days.push(d); }
  return `<div style="display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;min-width:1050px;">
    ${days.map(d=>{ const list = bookings.filter(b=>sameDay(b.startsAt,d)).sort((a,b)=>new Date(a.startsAt)-new Date(b.startsAt));
      return `<div><div style="font-weight:800;font-size:12.5px;padding-bottom:8px;border-bottom:2px solid ${sameDay(d,ANCHOR)?'var(--teal)':'var(--border-strong)'};margin-bottom:8px;">${fmtDate(d,{weekday:'short'})} <span style="color:var(--text-faint);font-weight:600;">${fmtDate(d,{day:'2-digit',month:'short'})}</span></div>
        <div style="display:flex;flex-direction:column;gap:6px;">${list.length ? list.map(b=>`<div data-cal-booking="${b.id}" style="border:1px solid var(--border);border-left:3px solid var(--teal);border-radius:8px;padding:6px 8px;cursor:pointer;">
            <div style="font-size:10.5px;font-weight:800;color:var(--teal-dark);">${fmtTime(b.startsAt)}</div><div style="font-size:11.5px;font-weight:700;">${custOf(b.customerId).name}</div><div style="font-size:10px;color:var(--text-faint);">${petNamesFor(b).join(', ')}</div>
          </div>`).join('') : `<p style="font-size:11px;color:var(--text-faint);">No bookings</p>`}</div>
      </div>`; }).join('')}
  </div>`;
}
function wireCalendarEvents(){
  wireLocationChipBar(()=>render('calendar'));
  document.querySelectorAll('[data-cal-view]').forEach(b => b.addEventListener('click', () => { CAL_STATE.view=b.dataset.calView; render('calendar'); }));
  document.getElementById('calPrev').addEventListener('click', () => { shiftCalDate(CAL_STATE.view==='day'?-1:-7); render('calendar'); });
  document.getElementById('calNext').addEventListener('click', () => { shiftCalDate(CAL_STATE.view==='day'?1:7); render('calendar'); });
  document.getElementById('calToday').addEventListener('click', () => { CAL_STATE.dateISO = localISO(ANCHOR); render('calendar'); });
  document.getElementById('calGroomerFilter').addEventListener('change', function(){ CAL_STATE.groomer=this.value; render('calendar'); });
  document.getElementById('calServiceFilter').addEventListener('change', function(){ CAL_STATE.service=this.value; render('calendar'); });
  document.querySelectorAll('[data-cal-booking]').forEach(el => el.addEventListener('click', () => openBookingDrawer(bookingOf(el.dataset.calBooking))));
}
function shiftCalDate(days){ const d = new Date(CAL_STATE.dateISO+'T00:00:00'); d.setDate(d.getDate()+days); CAL_STATE.dateISO = localISO(d); }
WIRERS.calendar = wireCalendarEvents;

/* ---------- FINANCE ---------- */
let FIN_RANGE = 'month';
function inRange(date, range){
  const d = new Date(date);
  if (range==='today') return sameDay(d, ANCHOR);
  if (range==='week') return daysBetween(d, ANCHOR) <= 7 && d <= ANCHOR;
  if (range==='month') return d.getFullYear()===ANCHOR.getFullYear() && d.getMonth()===ANCHOR.getMonth();
  return true;
}
function invoiceGroomerNames(inv){
  if (!inv.bookingId) return [];
  const b = bookingOf(inv.bookingId); if (!b) return [];
  return [...new Set(inv.lines.map(l => { const jp = b.pets.find(p=>p.petId===l.petId); return jp && jp.groomerId ? staffOf(jp.groomerId).name : null; }).filter(Boolean))];
}
RENDERERS.finance = function(){
  const org = currentOrg();
  const all = invoicesForOrg(org.id).filter(i => STATE.locationId==='all' || i.locationId===STATE.locationId);
  const inv = all.filter(i => inRange(i.issuedAt, FIN_RANGE));
  const refunds = inv.filter(i=>i.status==='refunded');
  const refundsTotal = sum(refunds, i=>refundedAmount(i));
  const revenue = sum(inv, netInvoiceValue);
  const paid = inv.filter(i=>i.status==='paid'); const unpaid = inv.filter(i=>i.status==='unpaid'||i.status==='partial');
  const discounts = sum(inv, i=>i.discountTotal);
  const taxes = sum(inv, i=>i.taxTotal);
  const packageRevenue = sum(inv.filter(i=>!i.bookingId), netInvoiceValue);
  const methodTotals = {}; inv.forEach(i => i.payments.forEach(p => methodTotals[p.method] = (methodTotals[p.method]||0) + p.amount));
  const serviceTotals = {}; inv.forEach(i => { const ratio=i.total?netInvoiceValue(i)/i.total:0; if(i.bookingId) i.lines.forEach(l => { const name = l.name.split(' — ')[0]; serviceTotals[name] = (serviceTotals[name]||0) + l.lineTotal*ratio; }); });
  const groomerTotals = {}; inv.forEach(i => { const names = invoiceGroomerNames(i); const share = names.length ? netInvoiceValue(i)/names.length : 0; names.forEach(n => groomerTotals[n] = (groomerTotals[n]||0)+share); });
  const locTotals = {}; inv.forEach(i => { const l = locOf(i.locationId); locTotals[l.name] = (locTotals[l.name]||0) + netInvoiceValue(i); });

  return `
  <div class="page-head"><div><div class="page-title">Finance</div><div class="page-sub">Revenue, invoices and payments for ${org.name}.</div></div>
    <div class="page-actions"><button class="btn btn-secondary" id="finExportBtn"><svg class="icon icon-sm"><use href="#ic-download"/></svg>Export CSV</button></div></div>
  ${locationChipBar(org.id)}
  <div class="pillbar">${[['today','Today'],['week','Last 7 days'],['month','This month'],['all','All time']].map(([k,l])=>`<button class="chip-toggle ${FIN_RANGE===k?'active':''}" data-fin-range="${k}">${l}</button>`).join('')}</div>
  <div class="grid grid-4">
    ${kpi('ic-wallet','Revenue', rupiah(revenue), null, 'teal')}
    ${kpi('ic-check','Paid invoices', paid.length+' · '+rupiah(sum(paid,i=>i.total)), null, 'ok')}
    ${kpi('ic-clock-alert','Unpaid / partial', unpaid.length+' · '+rupiah(sum(unpaid,i=>i.total-paidAmount(i))), null, 'danger')}
    ${kpi('ic-gift','Package revenue', rupiah(packageRevenue), null, 'coral')}
  </div>
  <div class="grid grid-4" style="margin-top:16px;">
    ${kpi('ic-info','Discounts given', rupiah(discounts), null, 'warn')}
    ${kpi('ic-info','Taxes collected', rupiah(taxes), null, 'info')}
    ${kpi('ic-info','Refunds', rupiah(refundsTotal)+` · ${refunds.length}`, null, 'gray')}
    ${kpi('ic-users','Locations reporting', Object.keys(locTotals).length, null, 'teal')}
  </div>
  <div class="grid grid-2" style="margin-top:18px;align-items:start;">
    <div class="card"><div class="card-head"><h3>Payment method breakdown</h3></div><div class="card-pad">${Object.keys(methodTotals).length ? donutChart(Object.keys(methodTotals).map((k,i)=>({label:k,value:methodTotals[k],color:CHART_PALETTE[i%CHART_PALETTE.length]}))) : emptyState('ic-wallet','No payments yet','')}</div></div>
    <div class="card"><div class="card-head"><h3>Revenue by location</h3></div><div class="card-pad">${Object.keys(locTotals).length ? barChart(Object.values(locTotals), Object.keys(locTotals), {money:true}) : emptyState('ic-building','No data yet','')}</div></div>
  </div>
  <div class="grid grid-2" style="margin-top:16px;align-items:start;">
    <div class="card"><div class="card-head"><h3>Revenue by service</h3></div><div class="table-wrap"><table><tbody>${Object.keys(serviceTotals).length?Object.entries(serviceTotals).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${k}</td><td class="cell-strong" style="text-align:right;">${rupiah(v)}</td></tr>`).join(''):`<tr><td>${emptyState('ic-scissors','No service revenue yet','')}</td></tr>`}</tbody></table></div></div>
    <div class="card"><div class="card-head"><h3>Revenue by groomer</h3></div><div class="table-wrap"><table><tbody>${Object.keys(groomerTotals).length?Object.entries(groomerTotals).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${k}</td><td class="cell-strong" style="text-align:right;">${rupiah(v)}</td></tr>`).join(''):`<tr><td>${emptyState('ic-user','No groomer revenue yet','')}</td></tr>`}</tbody></table></div></div>
  </div>
  <div class="card" style="margin-top:16px;">
    <div class="card-head"><h3>Invoices</h3><div class="sub">${inv.length} invoice(s) in range</div></div>
    ${inv.length ? `<div class="table-wrap"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Location</th><th>Issued</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>
      ${inv.slice().sort((a,b)=>new Date(b.issuedAt)-new Date(a.issuedAt)).map(i=>`<tr><td class="cell-strong">${i.invoiceNumber}</td><td><a data-goto-cust="${i.customerId}" style="cursor:pointer;text-decoration:none;color:inherit;font-weight:700;">${custOf(i.customerId).name}</a></td><td class="cell-soft">${locOf(i.locationId).name}</td><td class="cell-soft">${fmtDate(i.issuedAt)}</td><td class="cell-strong">${rupiah(i.total)}</td><td>${paymentBadge(paymentStatusLabel(i))}</td><td class="row-actions"><button class="btn btn-ghost btn-sm" data-view-inv="${i.id}">View</button></td></tr>`).join('')}
    </tbody></table></div>` : emptyState('ic-wallet','No invoices in this range','Try a wider date range.')}
  </div>`;
};
function wireFinanceEvents(){
  wireLocationChipBar(()=>render('finance'));
  document.querySelectorAll('[data-fin-range]').forEach(b=>b.addEventListener('click', ()=>{ FIN_RANGE=b.dataset.finRange; render('finance'); }));

let MY_SCHEDULE_GROOMER_ID = null;

  const list = groomersForOrg(orgId);

  return picked || list[0];
}

  if (!groomer) return emptyState('ic-user','No groomer on file', 'This organization has no groomer staff yet.');

  <div class="card" style="margin-top:18px;">
    <div class="card-head"><h3>Today’s jobs</h3></div>

    </tbody></table></div>` : emptyState('ic-calendar','Nothing upcoming yet','')}

};

  </div></div>`;

let LB_RANGE = 'month';
function leaderboardRow(staff){
  const assigned = BOOKINGS.filter(b => b.orgId===staff.orgId && b.pets.some(p=>p.groomerId===staff.id) && inRange(b.startsAt, LB_RANGE));
  const completedPets = sum(assigned, b=>b.pets.filter(p=>p.groomerId===staff.id && p.status==='complete').length);
  const revenue = sum(assigned, b=>sum(b.pets.filter(p=>p.groomerId===staff.id && p.status==='complete'), p=>sum(p.serviceIds.map(svcOf), s=>s.price)));
  const customersServed = [...new Set(assigned.filter(b=>b.pets.some(p=>p.groomerId===staff.id && p.status==='complete')).map(b=>b.customerId))];
  const rebooked = customersServed.filter(cid => BOOKINGS.some(b=>b.customerId===cid && new Date(b.startsAt)>ANCHOR)).length;
  const rebookingRate = customersServed.length ? Math.round(rebooked/customersServed.length*100) : 0;
  const cancelledOrNoShow = assigned.filter(b=>['cancelled','no_show'].includes(b.status)).length;
  const onTime = assigned.length ? Math.round((1 - cancelledOrNoShow/assigned.length)*100) : 100;
  return { staff, completedPets, revenue, rebookingRate, onTime };
}

  root.innerHTML = `<div class="tour-scrim" id="tourScrim"></div>

          <button class="btn btn-primary btn-sm" id="tourNext">${TOUR.step===TOUR_STEPS.length-1?'Finish':'Next'}</button>
        </div>
      </div>
    </div>`;

  'operations':['Operations','Track each pet from arrival to pickup'],

function navigate(route, param){
  const hash = '#/' + route + (param ? '/'+param : '');
  if (location.hash !== hash) { location.hash = hash; return; } // will re-enter via hashchange
  render(route, param);
}
function render(route, param){
  const routeDefinition = NAV_DEFS.find(n=>n.id===route);
  if (routeDefinition && !routeDefinition.roles.includes(STATE.role)){
    const fallback = STATE.role==='Groomer' ? 'my-schedule' : 'dashboard';
    if (route!==fallback) { navigate(fallback); return; }
  }
  STATE.route = route; STATE.routeParam = param;
  const view = document.getElementById('view');
  const meta = PAGE_META[route] || ['Not found', ''];
  const fn = RENDERERS[route];
  try{
    view.innerHTML = fn ? fn(param) : `<div class="empty-state"><svg class="icon"><use href="#ic-info"/></svg><b>Page not available</b><p>This screen isn't available for the current role.</p></div>`;
  }catch(err){
    console.error(err);
    view.innerHTML = `<div class="empty-state"><svg class="icon"><use href="#ic-info"/></svg><b>Something needs a refresh</b><p>${escapeHtml(err.message)}</p></div>`;
  }
  if (WIRERS[route]) { try{ WIRERS[route](param); }catch(err){ console.error(err); } }
  document.getElementById('contentWrap').scrollTop = 0;
  window.scrollTo(0,0);
  updateNavBadges();
  renderBreadcrumbAndTitle(route, meta, param);
  closeAllTopbarPanels();
  if (window.innerWidth <= 960) closeMobileSidebar();
}
function renderBreadcrumbAndTitle(route, meta, param){
  const wrap = document.getElementById('contentWrap');
  let host = document.getElementById('pageHeadHost');
  if (route === 'customers' && param){
    const c = custOf(param);
    wrap.querySelector('#view').insertAdjacentHTML('afterbegin', `<div class="breadcrumb"><a href="#/customers" style="cursor:pointer;text-decoration:none;color:inherit;">Customers</a><svg class="icon icon-sm sep"><use href="#ic-chevron-right"/></svg><span>${escapeHtml(c?c.name:'')}</span></div>`);
  } else {
    wrap.querySelector('#view').insertAdjacentHTML('afterbegin', `<div class="breadcrumb"><span>Operro</span><svg class="icon icon-sm sep"><use href="#ic-chevron-right"/></svg><span>${meta[0]}</span></div>`);
  }
}
window.addEventListener('hashchange', () => {
  const parts = location.hash.replace('#/','').split('/').filter(Boolean);
  render(parts[0] || 'dashboard', parts[1]);
});

function closeAllTopbarPanels(){ document.querySelectorAll('.dropdown-panel').forEach(p=>p.remove()); document.querySelectorAll('[aria-expanded="true"]').forEach(el=>el.setAttribute('aria-expanded','false')); }
function toggleTopbarPanel(anchorEl, key, buildFn){
  const existing = document.getElementById('panel-'+key);
  closeAllTopbarPanels();
  if (existing) return; // was open, click closed it
  const panel = document.createElement('div');
  panel.className = 'dropdown-panel'; panel.id = 'panel-'+key;
  panel.innerHTML = buildFn();
  anchorEl.parentElement.style.position = 'relative';
  anchorEl.parentElement.appendChild(panel);
  anchorEl.setAttribute('aria-expanded', 'true');
  setTimeout(()=>{ document.addEventListener('mousedown', outsideCloseHandler); }, 0);
  return panel;
}
function outsideCloseHandler(e){
  const panels = document.querySelectorAll('.dropdown-panel');
  let inside = false;
  panels.forEach(p => { if (p.contains(e.target)) inside = true; });
  if (!inside){ closeAllTopbarPanels(); document.removeEventListener('mousedown', outsideCloseHandler); }
}

  const loc = STATE.locationId==='all' ? locsForOrg(org.id).map(l=>l.name).join(' + ') : locOf(STATE.locationId).name;
  document.getElementById('orgLocation').textContent = loc;
  document.getElementById('roleLabel').textContent = STATE.role;
  document.getElementById('todayLabel').textContent = fmtDate(ANCHOR, { weekday:'long', day:'2-digit', month:'short', year:'numeric' });
}
